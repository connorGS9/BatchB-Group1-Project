<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banking API — Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    background: linear-gradient(90deg, #0b1220, #14213d);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .health { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
  .panel > h2 { font-size: 15px; margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .panel .body { padding: 16px 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  tbody tr:hover { background: rgba(56,189,248,.05); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.active { background: rgba(34,197,94,.15); color: var(--accent-2); }
  .pill.inactive { background: rgba(248,113,113,.15); color: var(--danger); }
  .pill.type { background: rgba(56,189,248,.15); color: var(--accent); }
  form.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  input, select {
    background: #0b1220; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 120px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #04222e; border: none; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.ghost:hover { color: var(--text); }
  button.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; font-size: 12px; }
  .toolbar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--accent-2); }
  .msg.err { color: var(--danger); }
  .empty { color: var(--muted); padding: 14px 10px; font-style: italic; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><span>◆</span> Banking API Dashboard</h1>
  <div class="health"><span id="healthDot" class="dot"></span><span id="healthText">checking…</span></div>
</header>

<main>
  <div class="kpis">
    <div class="kpi"><div class="label">Accounts</div><div class="value" id="kpiAccounts">–</div></div>
    <div class="kpi"><div class="label">Total Balance</div><div class="value" id="kpiBalance">–</div></div>
    <div class="kpi"><div class="label">Customers</div><div class="value" id="kpiCustomers">–</div></div>
    <div class="kpi"><div class="label">Transactions</div><div class="value" id="kpiTxns">–</div></div>
  </div>

  <!-- Transfer -->
  <div class="panel">
    <h2>Transfer money</h2>
    <div class="body">
      <form class="row" id="transferForm">
        <div class="field"><label>From account ID</label><input type="number" id="tFrom" required min="1" /></div>
        <div class="field"><label>To account ID</label><input type="number" id="tTo" required min="1" /></div>
        <div class="field"><label>Amount</label><input type="number" id="tAmount" required min="0.01" step="0.01" /></div>
        <button type="submit">Send transfer</button>
      </form>
      <div class="msg" id="transferMsg"></div>
    </div>
  </div>

  <!-- Accounts -->
  <div class="panel">
    <h2>Accounts</h2>
    <div class="body">
      <div class="toolbar">
        <div class="field"><label>Branch ID</label><input type="number" id="fBranch" placeholder="any" /></div>
        <div class="field"><label>Min balance</label><input type="number" id="fMinBal" placeholder="any" step="0.01" /></div>
        <button id="applyAcctFilter">Filter</button>
        <button class="ghost" id="clearAcctFilter">Clear</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>Account #</th><th>Name</th><th class="num">Balance</th><th>Branch</th><th>Status</th><th></th></tr></thead>
        <tbody id="accountsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="grid-2">
    <!-- Transactions -->
    <div class="panel">
      <h2>Transaction ledger</h2>
      <div class="body">
        <div class="toolbar">
          <div class="field"><label>Start date</label><input type="date" id="fStartDate" /></div>
          <div class="field"><label>Type</label>
            <select id="fType"><option value="">any</option><option>TRANSFER</option><option>DEPOSIT</option><option>WITHDRAWAL</option></select>
          </div>
          <button id="applyTxnFilter">Filter</button>
          <button class="ghost" id="clearTxnFilter">Clear</button>
        </div>
        <table>
          <thead><tr><th>ID</th><th>From</th><th>To</th><th class="num">Amount</th><th>Type</th><th>When</th></tr></thead>
          <tbody id="txnsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Customers -->
    <div class="panel">
      <h2>Customers</h2>
      <div class="body">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th></tr></thead>
          <tbody id="customersBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
const API = "/api/v1";
const fmt = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);
const el = id => document.getElementById(id);

async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error((data && data.detail) || ("HTTP " + res.status));
  return data;
}

async function checkHealth() {
  try {
    const r = await fetch("/health"); await r.json();
    el("healthDot").className = "dot ok"; el("healthText").textContent = "API online";
  } catch {
    el("healthDot").className = "dot bad"; el("healthText").textContent = "API offline";
  }
}

async function loadAccounts() {
  const params = new URLSearchParams();
  if (el("fBranch").value) params.set("branch_id", el("fBranch").value);
  if (el("fMinBal").value) params.set("min_balance", el("fMinBal").value);
  const qs = params.toString() ? "?" + params.toString() : "";
  const accounts = await api("GET", "/accounts/" + qs);
  const body = el("accountsBody");
  body.innerHTML = "";
  if (!accounts.length) { body.innerHTML = '<tr><td colspan="7" class="empty">No accounts match.</td></tr>'; }
  let total = 0;
  for (const a of accounts) {
    total += a.balance;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${a.id}</td><td>${a.account_number}</td>
      <td>${a.first_name} ${a.last_name}</td>
      <td class="num">${fmt(a.balance)}</td><td>${a.branch_id}</td>
      <td><span class="pill ${a.is_active ? "active" : "inactive"}">${a.is_active ? "active" : "inactive"}</span></td>
      <td>${a.is_active ? `<button class="danger" data-deact="${a.id}">Deactivate</button>` : ""}</td>`;
    body.appendChild(tr);
  }
  body.querySelectorAll("[data-deact]").forEach(b =>
    b.addEventListener("click", async () => {
      await api("DELETE", "/accounts/" + b.dataset.deact);
      refreshAll();
    }));
  // Only reflect the unfiltered total in the KPI when no filter is active.
  if (!qs) el("kpiBalance").textContent = fmt(total);
}

async function loadTransactions() {
  const params = new URLSearchParams();
  if (el("fStartDate").value) params.set("start_date", el("fStartDate").value);
  if (el("fType").value) params.set("type", el("fType").value);
  const qs = params.toString() ? "?" + params.toString() : "";
  const txns = await api("GET", "/transactions/" + qs);
  const body = el("txnsBody");
  body.innerHTML = "";
  if (!txns.length) { body.innerHTML = '<tr><td colspan="6" class="empty">No transactions match.</td></tr>'; }
  for (const t of txns) {
    const when = new Date(t.timestamp).toLocaleString();
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${t.id}</td><td>${t.from_account_id}</td><td>${t.to_account_id}</td>
      <td class="num">${fmt(t.amount)}</td>
      <td><span class="pill type">${t.type}</span></td><td>${when}</td>`;
    body.appendChild(tr);
  }
}

async function loadCustomers() {
  const customers = await api("GET", "/customers/");
  const body = el("customersBody");
  body.innerHTML = "";
  if (!customers.length) { body.innerHTML = '<tr><td colspan="4" class="empty">No customers.</td></tr>'; }
  for (const c of customers) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${c.id}</td><td>${c.first_name} ${c.last_name}</td><td>${c.email}</td>
      <td><span class="pill ${c.is_active ? "active" : "inactive"}">${c.is_active ? "active" : "inactive"}</span></td>`;
    body.appendChild(tr);
  }
  el("kpiCustomers").textContent = customers.length;
}

async function refreshKpis() {
  const [accounts, txns] = await Promise.all([api("GET", "/accounts/"), api("GET", "/transactions/")]);
  el("kpiAccounts").textContent = accounts.length;
  el("kpiTxns").textContent = txns.length;
  el("kpiBalance").textContent = fmt(accounts.reduce((s, a) => s + a.balance, 0));
}

async function refreshAll() {
  await Promise.all([loadAccounts(), loadTransactions(), loadCustomers(), refreshKpis()]);
}

// --- events ---
el("transferForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = el("transferMsg");
  msg.className = "msg"; msg.textContent = "Sending…";
  try {
    const t = await api("POST", "/transactions/transfer", {
      from_account_id: +el("tFrom").value,
      to_account_id: +el("tTo").value,
      amount: +el("tAmount").value,
    });
    msg.className = "msg ok";
    msg.textContent = `✓ Transfer #${t.id}: ${fmt(t.amount)} from account ${t.from_account_id} → ${t.to_account_id}`;
    el("transferForm").reset();
    refreshAll();
  } catch (err) {
    msg.className = "msg err"; msg.textContent = "✗ " + err.message;
  }
});

el("applyAcctFilter").addEventListener("click", loadAccounts);
el("clearAcctFilter").addEventListener("click", () => { el("fBranch").value = ""; el("fMinBal").value = ""; loadAccounts(); refreshKpis(); });
el("applyTxnFilter").addEventListener("click", loadTransactions);
el("clearTxnFilter").addEventListener("click", () => { el("fStartDate").value = ""; el("fType").value = ""; loadTransactions(); });

checkHealth();
refreshAll();
setInterval(checkHealth, 10000);
</script>
</body>
</html>
